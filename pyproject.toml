[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "virtualmocap"
version = "0.1.0"
description = "Digital Twin for Optical Tracking Systems Design"
authors = ["Lorenzo Carrera de Oliveira <lorenzo.oliveira@ee.ufcg.edu.br>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/loolirer/VirtualMoCap"
repository = "https://github.com/loolirer/VirtualMoCap"
keywords = ["mocap", "VMC", "motion-capture", "digital-twin", "optical-tracking"]
classification = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: Capture"
]
packages = [
    { include = "virtualmocap" }
]

python = "^3.10"
numpy = ">=1.26.2"
cbor = ">=1.0.0"
cbor2 = ">=5.5.1"
coppeliasim_zmqremoteapi_client = ">=2.0.0"
ipykernel = ">=6.26.0"
ipython = ">=8.17.2"
jupyter_client = ">=8.6.0"
jupyter_core = ">=5.5.0"
matplotlib = ">=3.8.1"
matplotlib-inline = ">=0.1.6"
nbformat = ">=5.9.2"
opencv-python = ">=4.8.1.78"
plotly = ">=5.18.0"
pyzmq = ">=25.1.1"
scikit-learn = ">=1.3.2"
scipy = ">=1.11.3"
zmq = ">=0.0.0"